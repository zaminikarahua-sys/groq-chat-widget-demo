<!DOCTYPE html>
<html>
<head>
  <title>Asha Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- BUBBLE -->
<div class="bubble" onclick="toggleChat()">💬</div>

<!-- WELCOME POPUP -->
<div class="welcome" id="welcome">
  <div class="welcome-box">
    <h3>👋 Hi, I'm Asha</h3>
    <p>Your AI assistant is ready</p>
    <button onclick="startChat()">Start Chat</button>
  </div>
</div>

<!-- CHAT -->
<div class="chat-box" id="chatBox">

  <div class="header">
    <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjshi9Kx4GMdzNjgEj4LT4SKK4azF434G2fFRERcSNQHXzKJx6mmo5p1egyfx6Ch4r-32jOIBR1FAtlZBXhmi6gAEAv_5q_Cvlj6hyCLOfoi10NSCywRfSVnXBOEZijxQ7eUuLTrLHkkOvFLIzuBWFGfqyzum154SzMTFco23zsO71C9W6F8L3VHC9T9qeI/s1600/1000002728.jpg">
    <div>
      <h3>Asha Bogorian</h3>
      <small id="status">AI Assistant</small>
    </div>
  </div>

  <!-- QUICK SUGGESTIONS -->
  <div class="suggestions">
    <button onclick="quick('Can you ship worldwide?')">🌍 Ship worldwide?</button>
    <button onclick="quick('What is good for bedroom shelves?')">🛏️ Bedroom shelves</button>
    <button onclick="quick('Best metal rack ideas?')">📦 Metal rack ideas</button>
  </div>

  <div id="messages"></div>

  <div class="input">
    <input id="input" placeholder="Ask Asha...">
    <button onclick="send()">Send</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
